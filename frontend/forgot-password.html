<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Market · Recuperar contraseña</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar glass">
  <a class="brand" href="index.html"><span class="dot"></span> 3D Market</a>
  <nav><a href="index.html">Inicio</a></nav>
</header>

<div class="auth-wrapper">
  <div class="auth-card glass">
    <h2>¿Olvidaste tu contraseña?</h2>
    <p class="subtitle">Te enviaremos un enlace de recuperación a tu correo.</p>

    <form id="forgotForm">
      <div class="field">
        <label for="forgotEmail">Correo electrónico</label>
        <input type="email" id="forgotEmail" required>
      </div>
      <button class="btn block" type="submit">Enviar enlace</button>
      <div class="form-msg" id="forgotMsg"></div>
    </form>

    <div class="auth-links">
      <a href="login.html">Volver a iniciar sesión</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
