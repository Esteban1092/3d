<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Market · Restablecer contraseña</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar glass">
  <a class="brand" href="index.html"><span class="dot"></span> 3D Market</a>
  <nav><a href="index.html">Inicio</a></nav>
</header>

<div class="auth-wrapper">
  <div class="auth-card glass">
    <h2>Restablece tu contraseña</h2>
    <p class="subtitle">Elige una nueva contraseña segura.</p>

    <form id="resetForm">
      <div class="field password">
        <label for="resetPassword">Nueva contraseña</label>
        <input type="password" id="resetPassword" required minlength="8">
        <button type="button" class="toggle-eye" data-target="resetPassword">👁️</button>
        <div class="password-strength" id="resetPasswordStrength"><span></span></div>
      </div>
      <div class="field password">
        <label for="resetPasswordConfirm">Confirma la contraseña</label>
        <input type="password" id="resetPasswordConfirm" required minlength="8">
        <button type="button" class="toggle-eye" data-target="resetPasswordConfirm">👁️</button>
      </div>
      <button class="btn block" type="submit">Guardar nueva contraseña</button>
      <div class="form-msg" id="resetMsg"></div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
