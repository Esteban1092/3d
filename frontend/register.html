<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Market · Crear cuenta</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar glass">
  <a class="brand" href="index.html"><span class="dot"></span> 3D Market</a>
  <nav><a href="index.html">Inicio</a></nav>
</header>

<div class="auth-wrapper">
  <div class="auth-card glass">
    <h2>Crea tu cuenta</h2>
    <p class="subtitle">Te enviaremos un correo para verificar tu cuenta.</p>

    <form id="registerForm">
      <div class="field">
        <label for="regName">Nombre</label>
        <input type="text" id="regName" required>
      </div>
      <div class="field">
        <label for="regEmail">Correo electrónico</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="field password">
        <label for="regPassword">Contraseña</label>
        <input type="password" id="regPassword" required minlength="8">
        <button type="button" class="toggle-eye" data-target="regPassword" aria-label="Mostrar contraseña"></button>
        <div class="password-strength" id="regPasswordStrength"><span></span></div>
      </div>
      <button class="btn block" type="submit">Registrarme</button>
      <div class="form-msg" id="registerMsg"></div>
    </form>

    <div class="auth-links">
      <a href="login.html">Ya tengo cuenta</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
