<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Market · Iniciar sesión</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar glass">
  <a class="brand" href="index.html"><span class="dot"></span> 3D Market</a>
  <nav><a href="index.html">Inicio</a></nav>
</header>

<div class="auth-wrapper">
  <div class="auth-card glass">
    <h2>Inicia sesión</h2>
    <p class="subtitle">Entra para dar like, comentar y cotizar los proyectos.</p>

    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Correo electrónico</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field password">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" required>
        <button type="button" class="toggle-eye" data-target="loginPassword" aria-label="Mostrar contraseña"></button>
      </div>
      <button class="btn block" type="submit">Entrar</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>

    <div class="auth-links">
      <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
      <a href="register.html">Crear cuenta</a>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
